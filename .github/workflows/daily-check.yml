name: Daily Maritime Job Check

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Kuala_Lumpur (UTC+8)
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Позволяет запустить вручную (Actions -> Daily Maritime Job Check -> Run workflow)
    # для тестирования парсеров без ожидания расписания.

permissions:
  contents: write

concurrency:
  group: maritime-job-agent-daily-check
  cancel-in-progress: false

jobs:
  check-vacancies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job agent
        id: run_agent
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python main.py

      - name: Commit updated seen_vacancies.json
        if: always()
        run: |
          git config user.name "maritime-job-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- seen_vacancies.json; then
            git add seen_vacancies.json
            git commit -m "chore: update seen_vacancies.json [skip ci]"
            git push
          else
            echo "seen_vacancies.json не изменился — коммитить нечего."
          fi
