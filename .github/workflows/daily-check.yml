name: Daily Maritime Job Check

on:
  schedule:
    # Каждый час в :17 (UTC). Нечётная минута — потому что запуски на :00
    # GitHub часто задерживает на 3-5 часов из-за перегрузки (так и было:
    # "00:00 UTC" реально стартовал в 04:00-05:00 UTC).
    # Письмо уходит только если появились НОВЫЕ подходящие вакансии,
    # поэтому частые запуски = вы узнаёте о вакансии в течение ~часа,
    # а не раз в сутки.
    - cron: "17 * * * *"
  workflow_dispatch:
    # Ручной запуск: Actions -> Daily Maritime Job Check -> Run workflow

permissions:
  contents: write

concurrency:
  group: maritime-job-agent-daily-check
  cancel-in-progress: false

jobs:
  check-vacancies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Headless-браузер — резерв для сайтов, блокирующих простой HTTP (403)
          python -m playwright install --with-deps chromium

      - name: Run job agent
        id: run_agent
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Вход на портал моряка JobMarineMan (необязательно)
          JMM_LOGIN: ${{ secrets.JMM_LOGIN }}
          JMM_PASSWORD: ${{ secrets.JMM_PASSWORD }}
          # Уведомления в Telegram через вашего бота (необязательно)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated seen_vacancies.json
        if: always()
        run: |
          git config user.name "maritime-job-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- seen_vacancies.json; then
            git add seen_vacancies.json
            git commit -m "chore: update seen_vacancies.json [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "seen_vacancies.json не изменился — коммитить нечего."
          fi

      - name: Keepalive (prevent GitHub auto-disabling the schedule)
        # GitHub отключает scheduled-workflow, если в репозитории нет коммитов
        # 60 дней (так и случилось 2026-10-31). Раз в ~40 дней тишины делаем
        # пустой коммит, чтобы расписание никогда не выключалось само.
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Дней с последнего коммита: $days"
          if [ "$days" -ge 40 ]; then
            git config user.name "maritime-job-agent-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
