# =============================================================================
# Maritime Job Agent — конфигурация фильтров и поведения
# Меняйте этот файл, чтобы изменить критерии поиска — без правки кода.
# =============================================================================

filters:
  # Должность. Ищем по вхождению слова (регистр не важен, границы слова
  # учитываются, чтобы "Master" не совпадал с "Master's degree" и т.п.)
  positions:
    - captain
    - master
    - капитан*      # "*" = любое окончание: капитан, капитана, капитаны
    - mst           # сокращение Master в объявлениях ("MST for bulk carrier")

  # Фразы, которые НЕ означают должность капитана, хотя содержат это слово.
  # Вырезаются из текста перед проверкой должности.
  position_exclude:
    - "помощник* капитан*"     # старший/второй/третий помощник капитана
    - "помощник* по радиоэлектронике"
    - "staff captain"          # на пассажирских судах — не капитан

  # Слова/фразы, по которым определяем "Bulk Carrier Capesize и выше".
  # Newcastlemax и VLOC/VLBC — это подклассы, которые тоже подходят,
  # поэтому перечислены явно.
  vessel_types:
    - capesize
    - newcastlemax
    - vloc
    - vlbc
    - very large ore carrier
    - very large bulk carrier
    - post panamax bulk carrier   # некоторые объявления пишут размер так

  # Если объявление указывает дедвейт (DWT) числом, но не называет класс
  # судна словами выше — считаем, что судно подходит начиная с этого DWT.
  # Capesize начинается примерно от 150 000 DWT.
  dwt_min: 150000

  # Логика для вакансий, где явно написано просто "Bulk Carrier" / "Bulker" /
  # "Ore Carrier" без указания класса (см. evaluate_vessel() в parsers/base.py):
  #   - явное упоминание класса из vessel_types выше -> подходит
  #   - "Bulk Carrier" + DWT указан и DWT >= dwt_min -> подходит
  #   - "Bulk Carrier" + DWT указан и DWT <  dwt_min -> НЕ подходит (маленькое судно)
  #   - "Bulk Carrier" + класс/DWT в карточке НЕ указаны вовсе -> подходит,
  #     но письмо помечает такую строку "⚠️ класс судна не указан — проверьте вручную"
  # Это осознанный компромисс: явное указание Capesize/Newcastlemax/VLOC в
  # карточках источников встречается редко, а полностью отсеивать все
  # "просто Bulk Carrier" вакансии означало бы упускать реально подходящие.

  # Общие слова "это балкер/сухогруз" — к ним применяется правило DWT выше
  # (DWT указан и < dwt_min -> отсеиваем; DWT не указан -> пометка ⚠️).
  # "*" в конце = любое окончание (балкер, балкере, балкеры, сухогрузы...).
  bulk_generic_keywords:
    - bulk carrier
    - bulker
    - ore carrier
    - bulk          # в Telegram пишут коротко: "Master on bulk"
    - балкер*
    - навалочник*
    - сухогруз*

  # --- ПРИОРИТЕТ №1: КЕЙПСАЙЗ ---
  # Балкер/рудовоз считается кейпсайзом, если класс назван явно (слова ниже)
  # ИЛИ DWT >= capesize_dwt_min ИЛИ GT (ГРТ/БРТ) >= capesize_gt_min.
  # Кейпсайзы идут в письме первым блоком, в теме пометка "🟢 КЕЙПСАЙЗ".
  capesize_dwt_min: 170000
  capesize_gt_min: 80000
  capesize_ignore_salary: true   # для кейпсайзов фильтр по зарплате не применяется
  capesize_keywords:
    - capesize
    - cape size
    - newcastlemax
    - vloc
    - vlbc
    - valemax
    - chinamax
    - very large ore carrier
    - very large bulk carrier
    - кейпсайз*
    - кэйпсайз*

  # Минимальная зарплата в USD/мес.
  min_salary_usd: 10500

  # Зарплаты в евро пересчитываются в USD по этому курсу (обновляйте при необходимости)
  eur_to_usd: 1.10

  # Как поступать с вакансиями, где зарплата вообще не указана на сайте,
  # но остальные критерии (должность + тип судна) совпадают.
  #   true  -> включать в письмо с пометкой "зарплата не указана — уточнить"
  #   false -> строго исключать такие вакансии
  include_unknown_salary: true

  # Предохранитель: если за один запуск новых совпадений больше этого числа,
  # письмо не отправляется (почти наверняка сломался парсер, а не рынок).
  max_new_per_run: 40

  # Объявления старше стольких дней (если сайт пишет "Posted: N days ago") — пропускаются
  max_age_days: 21

  # Флаг судна / регион — пусто = без ограничений
  flags: []

  # Длительность контракта — пусто = без ограничений
  contract_lengths: []

network:
  timeout_seconds: 25
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
  # Пауза между запросами к разным сайтам (вежливость к серверам), в секундах
  polite_delay_seconds: 1.5

email:
  subject_prefix: "Maritime Jobs Digest"
  # Если получатель не задан через переменную окружения MAIL_TO,
  # письмо уходит на тот же адрес, что указан в GMAIL_ADDRESS.

sources:
  # Список источников можно временно отключать (enabled: false) не удаляя
  # сам файл-парсер — main.py просто пропустит выключенный источник.
  martide: { enabled: true }
  jobmarineman: { enabled: true }
  crewell: { enabled: true }
  # Maritime-Zone с 2026-10 отдаёт 403 на ВСЁ, включая главную и страницу
  # входа — ни браузер, ни логин не помогают. Включите обратно, если сайт откроется.
  maritime_zone: { enabled: false }
  turtle: { enabled: true }
  # FindSeafarer: раздела со списком вакансий не найдено (2026-11-03)
  findseafarer: { enabled: false }
  seacareer: { enabled: true }
  berge_bulk: { enabled: true }
  oldendorff: { enabled: true }
  columbia_shipmanagement: { enabled: true }
  ukrcrewing: { enabled: true }
  maritime_union: { enabled: true }
  seajobs: { enabled: true }
  telegram_channels: { enabled: true }
  maritime_bell: { enabled: true }
  seajobs_pro: { enabled: true }
  osm_thome: { enabled: true }
  proseafarers: { enabled: true }
  sea_man_org: { enabled: true }

# Посты старше стольких дней пропускаются (вакансия, скорее всего, закрыта)
telegram_max_age_days: 10

# Публичные Telegram-каналы (часть ссылки после t.me/). Читаются без аккаунта.
telegram_channels:
  - marinejobz      # MarineJobs, англ.
  - rekamore_su     # Rekamore, рус., ~38 тыс.
  - marinejobs      # MARINE JOBS, англ., ~30 тыс., ~30 постов/день
  - crewingua       # Crewing - Работа для моряков, ~17 тыс.
  - pervoemorskoe   # Первое Морское Агентство, рус., балкеры/сухогрузы
  - crewworks       # CREW WORK, рус.
  - jobs_seafarers  # YCrewing, англ.
